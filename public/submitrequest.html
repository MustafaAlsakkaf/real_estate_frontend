<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BONSAI Waiting List</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --clay:#6B3F36;
      --paper:#F4EEE6;
      --sand:#D8CBBE;
      --text:#1F1411;
    }

    html,body{
      margin:0;
      padding:0;
    }

    body{
      font-family:'Tajawal',sans-serif;
      background:linear-gradient(135deg,#5E352E,#6B3F36);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .card{
      width:420px;
      max-width: calc(100vw - 32px);
      background:var(--paper);
      border-radius:16px;
      padding:30px;
      box-shadow:0 20px 40px rgba(0,0,0,.2);
    }

    .lang-switch{
      text-align:left;
      margin-bottom:30px;
    }
    .lang-switch button{
      background:none;
      border:none;
      font-weight:600;
      cursor:pointer;
      font-family:'Tajawal',sans-serif;
      color: var(--text);
      padding:0;
    }

    h2{
      margin:0;
      text-align:center;
      letter-spacing:6px;
      color: var(--text);
    }

    .sub{
      text-align:center;
      color:#666;
      font-size:13px;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:600;
      font-size:13px;
      color: var(--text);
    }

    input,select,textarea{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid var(--sand);
      margin-top:6px;
      font-size:14px;
      font-family:'Tajawal',sans-serif;
      box-sizing:border-box;
      background:#fff;
      color: var(--text);
    }

    textarea{ min-height:90px; }

    input:focus, select:focus, textarea:focus{
      outline:none;
      border-color: var(--clay);
      box-shadow:0 0 0 3px rgba(107,63,54,0.15);
      background:#fff;
    }

    button.submit{
      width:100%;
      font-family:'Tajawal',sans-serif;
      margin-top:20px;
      padding:14px;
      background:var(--clay);
      color:white;
      border:none;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }
    button.submit:hover{ opacity:.95; }

    /* error hint (optional) */
    .hint{
      margin-top:8px;
      font-size:12px;
      color:#8b0000;
      display:none;
    }

    /* Hide zoho hidden rows/fields */
    .zoho-hidden{
      display:none !important;
      visibility:hidden !important;
      height:0 !important;
      overflow:hidden !important;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="lang-switch">
      <button type="button" onclick="setLang('ar')">عربي</button> |
      <button type="button" onclick="setLang('en')">English</button>
    </div>

    <h2 id="title">بــونــســـاي</h2>
    <p class="sub" id="subtitle">سيتواصل معك فريق المبيعات عند فتح باب الحجز</p>

    <!-- ✅ Zoho Web-to-Contact Form (kept required hidden tokens) -->
    <form
      id="webform12802000000671396"
      action="https://crm.zoho.sa/crm/WebToContactForm"
      name="WebToContacts12802000000671396"
      method="POST"
      accept-charset="UTF-8"
      onsubmit='javascript:document.charset="UTF-8"; return checkMandatory12802000000671396();'
    >
      <!-- REQUIRED HIDDEN FIELDS (do not remove) -->
      <input type="text" style="display:none;" name="xnQsjsdp" value="157232b19f676335ef89560086e46b2e5cc8317eab179d6a99fcbf4704061349">
      <input type="hidden" name="zc_gad" id="zc_gad" value="">
      <input type="text" style="display:none;" name="xmIwtLD" value="864afb6cbd13e2ca0a787f236968140c4e10933bea2b4a6a1beecfb73baed1a9e27e32c81cee298b3709531205f40085">
      <input type="text" style="display:none;" name="actionType" value="Q29udGFjdHM=">
      <input type="text" style="display:none;" name="returnURL" value="null">

      <!-- Visible fields (match your design) -->
      <label id="nameLabel" for="Last_Name">الاسم</label>
      <input id="Last_Name" type="text" name="Last Name" maxlength="80" aria-required="true" />

      <label id="mobileLabel" for="Mobile">الجوال</label>
      <input id="Mobile" type="text" name="Mobile" maxlength="30" aria-required="true" placeholder="05XXXXXXXX" />

      <label id="paymentLabel" for="CONTACTCF5">طريقة الشراء</label>
      <select id="CONTACTCF5" name="CONTACTCF5" aria-required="true" onchange="addAriaSelected12802000000671396(this)">
        <option id="chooseOption" value="-None-">اختر</option>
        <!-- keep values as Arabic (Zoho will store same) -->
        <option id="cashOption" value="كاش">كاش</option>
        <option id="financeOption" value="تمويل">تمويل</option>
      </select>

      <label id="msgLabel" for="CONTACTCF1">استفسار أو طلب خاص</label>
      <textarea id="CONTACTCF1" name="CONTACTCF1" placeholder="اكتب استفسارك هنا"></textarea>

      <!-- Hidden fields from your Zoho form (keep them, but hide from user) -->
      <div class="zoho-hidden">
        <!-- Stage -->
        <select id="CONTACTCF2" name="CONTACTCF2" onchange="addAriaSelected12802000000671396(this)">
          <option value="-None-">-None-</option>
          <option selected value="عميل جديد">عميل جديد</option>
          <option value="لم يرد حتى الآن">لم يرد حتى الآن</option>
          <option value="ربما مهتم">ربما مهتم</option>
          <option value="مهتم">مهتم</option>
          <option value="مهتم جداً">مهتم جداً</option>
          <option value="غير مهتم">غير مهتم</option>
          <option value="عميل حالي">عميل حالي</option>
        </select>

        <!-- Source -->
        <select id="CONTACTCF6" name="CONTACTCF6" onchange="addAriaSelected12802000000671396(this)">
          <option value="-None-">-None-</option>
          <option value="عميل عابر">عميل عابر</option>
          <option selected value="من الإدارة">من الإدارة</option>
          <option value="مرشح من طرفي">مرشح من طرفي</option>
          <option value="مرشح من صديق أو العائلة">مرشح من صديق أو العائلة</option>
          <option value="مرشح من عميل آخر">مرشح من عميل آخر</option>
          <option value="مرشح من مسوق عقاري">مرشح من مسوق عقاري</option>
        </select>

        <!-- Project -->
        <select id="CONTACTCF11" name="CONTACTCF11" onchange="addAriaSelected12802000000671396(this)">
          <option value="-None-">-None-</option>
          <option value="نجد ريزدنس 5">نجد ريزدنس 5</option>
          <option selected value="بونساي">بونساي</option>
        </select>

        <!-- UTM fields -->
        <input type="text" id="CONTACTCF10" name="CONTACTCF10" maxlength="255" value="Brochure" /> <!-- utm_source -->
        <input type="text" id="CONTACTCF7"  name="CONTACTCF7"  maxlength="255" value="Brochure" /> <!-- utm_medium -->
        <input type="text" id="CONTACTCF9"  name="CONTACTCF9"  maxlength="255" value="BONSAI" />   <!-- utm_campaign -->
        <input type="text" id="CONTACTCF8"  name="CONTACTCF8"  maxlength="255" value="BONSAI" />   <!-- utm_project -->
      </div>

      <!-- Zoho honeypot -->
      <input type="text" style="display:none;" name="aG9uZXlwb3Q" value="" />

      <button type="submit" class="submit" id="submitBtn">سجل في قائمة الانتظار</button>
    </form>

  </div>

  <script>
    // Language switch (from your form.html behavior)
    function setLang(lang){
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');

      const nameLabel = document.getElementById('nameLabel');
      const mobileLabel = document.getElementById('mobileLabel');
      const paymentLabel = document.getElementById('paymentLabel');
      const msgLabel = document.getElementById('msgLabel');

      const chooseOption = document.getElementById('chooseOption');
      const cashOption = document.getElementById('cashOption');
      const financeOption = document.getElementById('financeOption');

      const mobileInput = document.getElementById('Mobile');
      const msgInput = document.getElementById('CONTACTCF1');
      const submitBtn = document.getElementById('submitBtn');

      if(lang === "en"){
        document.documentElement.dir = "ltr";
        document.documentElement.lang = "en";

        title.innerText = "BONSAI";
        subtitle.innerText = "Our sales team will contact you when reservations open";

        nameLabel.innerText = "Name";
        mobileLabel.innerText = "Mobile";
        paymentLabel.innerText = "Payment Method";

        chooseOption.innerText = "Select";
        cashOption.innerText = "Cash";
        financeOption.innerText = "Finance";

        msgLabel.innerText = "Special Request or Question";
        submitBtn.innerText = "Join the Waiting List";

        mobileInput.placeholder = "05XXXXXXXX";
        msgInput.placeholder = "Write your request or question";
      } else {
        document.documentElement.dir = "rtl";
        document.documentElement.lang = "ar";

        title.innerText = "بــونــســـاي";
        subtitle.innerText = "سيتواصل معك فريق المبيعات عند فتح باب الحجز";

        nameLabel.innerText = "الاسم";
        mobileLabel.innerText = "الجوال";
        paymentLabel.innerText = "طريقة الشراء";

        chooseOption.innerText = "اختر";
        cashOption.innerText = "كاش";
        financeOption.innerText = "تمويل";

        msgLabel.innerText = "استفسار أو طلب خاص";
        submitBtn.innerText = "سجل في قائمة الانتظار";

        mobileInput.placeholder = "05XXXXXXXX";
        msgInput.placeholder = "اكتب استفسارك هنا";
      }
    }

    // Zoho accessibility helper (safe version)
    function addAriaSelected12802000000671396(selectEl){
      try{
        const previous = selectEl.querySelector('[aria-selected="true"]');
        if(previous) previous.removeAttribute('aria-selected');
        const opt = selectEl.options[selectEl.selectedIndex];
        if(opt) opt.setAttribute('aria-selected','true');
      }catch(e){}
    }

    // Zoho Mandatory validation (same logic, adapted)
    function checkMandatory12802000000671396(){
      var mndFileds = new Array('Last Name', 'Mobile', 'CONTACTCF5');
      var fldLangVal = new Array('Name - الاسم', 'Mobile - الجوال', 'Payment Method - طريقة الشراء');

      for (var i = 0; i < mndFileds.length; i++ ) {
        var fieldObj = document.forms['WebToContacts12802000000671396'][mndFileds[i]];
        if (fieldObj) {
          var val = (fieldObj.value || '').replace(/^\s+|\s+$/g,'');
          if (val.length === 0) {
            alert(fldLangVal[i] + ' cannot be empty.');
            fieldObj.focus();
            return false;
          } else if (fieldObj.nodeName === 'SELECT') {
            if (fieldObj.options[fieldObj.selectedIndex].value === '-None-') {
              alert(fldLangVal[i] + ' cannot be none.');
              fieldObj.focus();
              return false;
            }
          }
        }
      }

      // keep Zoho smarturl parameter logic
      var urlparams = new URLSearchParams(window.location.search);
      if (urlparams.has('service') && (urlparams.get('service') === 'smarturl')) {
        var webform = document.getElementById('webform12802000000671396');
        var service = urlparams.get('service');
        var smarturlfield = document.createElement('input');
        smarturlfield.setAttribute('type', 'hidden');
        smarturlfield.setAttribute('value', service);
        smarturlfield.setAttribute('name', 'service');
        webform.appendChild(smarturlfield);
      }

      // disable submit to prevent double submit
      document.getElementById('submitBtn').setAttribute('disabled', true);
      return true;
    }

    // default Arabic
    setLang('ar');
  </script>
<script>
  // UTM per-field fallback:
  // - Each field is handled independently
  // - If URL has a specific utm_* param => override ONLY that field
  // - If missing => keep the existing default value already in the input
  (function applyUTMOverrides(){
    try{
      const params = new URLSearchParams(window.location.search);

      const fields = [
        { urlKey: "utm_source",   inputId: "CONTACTCF10" }, // utm_source
        { urlKey: "utm_medium",   inputId: "CONTACTCF7"  }, // utm_medium
        { urlKey: "utm_campaign", inputId: "CONTACTCF9"  }, // utm_campaign
        { urlKey: "utm_project",  inputId: "CONTACTCF8"  }  // utm_project
      ];

      for (const f of fields){
        if (!params.has(f.urlKey)) continue;               // not present => keep default
        const v = (params.get(f.urlKey) || "").trim();
        if (!v) continue;                                  // empty => keep default
        const el = document.getElementById(f.inputId);
        if (el) el.value = v;                               // present => override only this field
      }
    }catch(e){}
  })();
</script>

</body>
</html>
