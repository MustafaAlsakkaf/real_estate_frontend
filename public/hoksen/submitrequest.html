  <title>HOKSEN Submit Request</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --black:#131718;
      --paper:#FFFFFF;
      --white:#FFFFFF;
      --text:#151515;
      --muted:#747474;
      --line:#E6E1D8;
      --gold:#F0CC93;
    }

    html,body{margin:0;padding:0;}

    body{
      font-family:'Tajawal',sans-serif;
      background:
        radial-gradient(circle at 72% 18%, rgba(240,204,147,.16), transparent 26%),
        linear-gradient(135deg, #131718 0%, #0D1011 62%, #070808 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
      box-sizing:border-box;
      color:var(--text);
    }

    .page-shell{
      width:100%;
      max-width:980px;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.08);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 28px 70px rgba(0,0,0,.38);
    }

    .brand-panel{
      position:relative;
      min-height:620px;
      background:
        linear-gradient(135deg, rgba(19,23,24,.98), rgba(19,23,24,.88)),
        repeating-radial-gradient(circle at 76% 18%, rgba(255,255,255,.07) 0 1px, transparent 1px 10px);
      padding:42px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
    }

    .brand-panel:before{
      content:"";
      position:absolute;
      inset:-25%;
      background:repeating-linear-gradient(145deg, rgba(255,255,255,.08) 0 1px, transparent 1px 12px);
      opacity:.16;
      transform:rotate(-8deg);
    }

    .brand-panel:after{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border-radius:50%;
      border:1px solid rgba(240,204,147,.28);
      right:-110px;
      bottom:-120px;
    }

    .brand-content{position:relative;z-index:1;}

    .top-mark{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      margin-bottom:30px;
      position:relative;
      z-index:1;
    }

    html[dir="ltr"] .top-mark{
      justify-content:flex-end;
    }

    .naqsh-logo{
      width:260px;
      max-width:72%;
      height:auto;
      display:block;
      filter: invert(1);
      opacity:.96;
    }



    .developer{
      color:var(--gold);
      font-size:14px;
      font-weight:700;
      margin-bottom:22px;
      letter-spacing:.5px;
    }

    .headline{
      color:#fff;
      font-size:38px;
      line-height:1.25;
      margin:0 0 18px;
      font-weight:800;
    }

    html[dir="ltr"] .headline{letter-spacing:.5px;}

    .description{
      color:rgba(255,255,255,.72);
      font-size:16px;
      line-height:1.9;
      margin:0;
      max-width:420px;
    }

    .feature-list{
      position:relative;
      z-index:1;
      display:grid;
      gap:12px;
      margin-top:30px;
    }

    .feature{
      color:#fff;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--gold);
      flex:0 0 auto;
    }

    .form-panel{
      background:#FFFFFF;
      padding:38px 34px;
      box-sizing:border-box;
      display:flex;
      align-items:center;
    }

    .card{
      width:100%;
      background:#FFFFFF;
      border:1px solid rgba(19,23,24,.08);
      border-radius:22px;
      padding:30px;
      box-sizing:border-box;
      box-shadow:0 18px 42px rgba(0,0,0,.06);
    }

    .lang-switch{
      text-align:left;
      margin-bottom:22px;
      color:var(--text);
      font-size:14px;
      font-weight:700;
    }

    html[dir="ltr"] .lang-switch{text-align:right;}

    .lang-switch button{
      background:none;
      border:none;
      font-weight:800;
      cursor:pointer;
      font-family:'Tajawal',sans-serif;
      color:var(--text);
      padding:0;
      font-size:14px;
    }

    .logo-wrap{text-align:center;margin-bottom:18px;}

    .logo{
      width:210px;
      max-width:72%;
      height:auto;
      display:inline-block;
    }

    h2{
      margin:0;
      text-align:center;
      color:var(--text);
      letter-spacing:0;
      font-size:28px;
      font-weight:800;
    }

    html[dir="ltr"] h2{letter-spacing:6px;}

    .sub{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      margin:10px 0 22px;
    }

    label{
      display:block;
      margin-top:14px;
      font-weight:800;
      font-size:14px;
      color:var(--text);
    }

    input,select,textarea{
      width:100%;
      padding:13px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      margin-top:7px;
      font-size:15px;
      font-family:'Tajawal',sans-serif;
      box-sizing:border-box;
      background:#fff;
      color:var(--text);
    }

    textarea{min-height:100px;resize:vertical;}

    input:focus, select:focus, textarea:focus{
      outline:none;
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(201,154,78,.18);
      background:#fff;
    }

    button.submit{
      width:100%;
      font-family:'Tajawal',sans-serif;
      margin-top:22px;
      padding:15px;
      background:linear-gradient(135deg, var(--black), #25292A);
      color:white;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      transition:.2s ease;
    }

    button.submit:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 24px rgba(0,0,0,.16);
    }

    button.submit:disabled{opacity:.65;cursor:not-allowed;transform:none;}

    .zoho-hidden{
      display:none !important;
      visibility:hidden !important;
      height:0 !important;
      overflow:hidden !important;
    }

    @media (max-width: 850px){
      body{
        align-items:flex-start;
        padding:0;
        background:var(--black);
      }

      .page-shell{
        display:block;
        border-radius:0;
        border:none;
        box-shadow:none;
      }

      .brand-panel{
        min-height:210px;
        padding:28px 22px;
      }

      .headline{font-size:26px;}

      .description{
        display:block;
        font-size:14px;
        line-height:1.7;
      }

      .feature-list{
        display:grid;
        gap:10px;
        margin-top:18px;
      }

      
      .form-panel{
        padding:0;
        background:#FFFFFF;
        border-radius:28px 28px 0 0;
        margin-top:-12px;
        position:relative;
        z-index:2;
      }

      .card{
        border-radius:28px 28px 0 0;
        box-shadow:none;
        border:none;
        padding:30px 16px 40px;
      }

      .naqsh-logo{width:220px;max-width:80%;}
      .logo{width:190px;}
      h2{font-size:26px;}
    }
  </style>
</head>
